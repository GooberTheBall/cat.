<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Translator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="../../imgs/translator/ah_so_cyan.png">
</head>
<body>

    <div id="loading-box">
        <img src="../../imgs/translator/loading-transparent.png">
    </div>

    <div id="logo-box">
        <img src="../../imgs/translator/logo3.png" id="logo">
    </div>

    <div id="space"></div>

    <div class="txt-boxs">
        <div class="col">
            <span class="txt-title">Input</span>
            <textarea id="txt-input-txt" placeholder="Put your input here!"></textarea>
        </div>
    
        <div class="col">
            <span class="txt-title">Output</span>
            <textarea id="txt-output-txt" placeholder="Output goes here!" readonly></textarea>
        </div>
    </div>

    <div id="space"></div>

    <button id="translate-btn">Translate</button>

    <div class="credit">
        <a href="https://www.youtube.com/watch?v=nt1ayLtsaZM">"Just Add Water" - FNAF Pizzeria Simulator OST</a>
    </div>

    <div class="ah_so_cyan">
        <img src="../../imgs/translator/ah_so_cyan.png">
    </div>

    <div class="bg">
        <div class="bg-inner">
            <img src="../../imgs/translator/bg.png" alt="">
            <img src="../../imgs/translator/bg.png" alt="" aria-hidden="true">
        </div>
    </div>

    <script src="main.js"></script>

</body>
</html>
