<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Clicker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="../../favicon.ico">
</head>
<body>

    <div id="count-box">
        <p id="count-txt">0</p>
    </div>

    <div class="eviltint"></div>

    <div id="clicker-box">
        <img src="../../cats/dear_god_its_him.png" id="click-cat-img" alt="*insert cat image here*" width="200" height="200">
    </div>

    <div id="survive-box">
        <p id="survive-txt">[!!SURVIVE FOR time!!]</p>
    </div> 


    <div id="lose-box">
        <p id="lose-txt">you lost :CCC</p>
    </div> 

    <div id="win-box">
        <p id="win-txt">YOU DID IT!!! :DD</p>
    </div> 

    <div id="best-cps-box">
        <p id="best-cps-txt">--</p>
    </div> 

    <div id="best-count-box">
        <p id="best-count-txt">--</p>
    </div> 



    <script src="main.js"></script>
</body>
</html>
