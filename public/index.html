<!DOCTYPE html>

    <!-- Prevent browser caching during development -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="css/style.css?v=6">

    <script>
        window.adjustButtonPositions = window.adjustButtonPositions || function() {
            const redP = document.getElementById('red_p');
            const apiBtn = document.getElementById('api-btn');
            const mewBtn = document.getElementById('mew-btn');
            const scaryBtn = document.getElementById('scary-btn');
            const togglemusicbtn = document.getElementById('toggle-music-btn');
            const fixmusicbtn = document.getElementById('fix-music-btn');
            
            const offset = redP ? 40 : 0;
            if (apiBtn) apiBtn.style.bottom = (0 + offset) + "px";
            if (mewBtn) mewBtn.style.bottom = (40 + offset) + "px";
            if (scaryBtn) scaryBtn.style.bottom = (80 + offset) + "px";
            if (togglemusicbtn) togglemusicbtn.style.bottom = (120 + offset) + "px";
        };
    </script>

    <script src="js/catbounce.js?v=6" defer></script>
    <script src="js/btns.js?v=6" defer></script>
    <!-- <script src="js/main.js?v=6" defer></script> -->

    <script>
        function loadMain(retries = 3) {
            const script = document.createElement('script');
            script.src = 'js/main.js?v=7';
            script.defer = true;
            script.onerror = () => {
                if (retries > 0) {
                    console.warn(`Portbuddy blocked main.js. Retrying in 2s... (${retries} left)`);
                    setTimeout(() => loadMain(retries - 1), 2000);
                }
            };
            document.head.appendChild(script);
        }
        // Call it slightly after the page loads
        window.addEventListener('load', () => loadMain());
    </script>

    <title>cat.</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
